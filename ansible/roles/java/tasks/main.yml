---
# tasks file for roles/java
- name: Update apt cache

  apt:

    update_cache: yes

- name: Install Java

  apt:

    name: openjdk-21-jdk

    state: present

- name: Verify Java installation

  shell: java -version

  register: java_version

- name: Show Java version

  debug:

    msg: "{{ java_version.stderr }}"
