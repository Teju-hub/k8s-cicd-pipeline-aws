---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Java and dependencies
  apt:
    name:
      - openjdk-21-jdk
      - curl
      - wget
    state: present

- name: Remove old Jenkins key and repo if exists
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/jenkins-keyring.asc
    - /etc/apt/sources.list.d/jenkins.list

- name: Download Jenkins 2026 GPG key
  shell: wget -O /usr/share/keyrings/jenkins-keyring.asc https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
  args:
    creates: /usr/share/keyrings/jenkins-keyring.asc

- name: Add Jenkins repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Install Jenkins
  apt:
    name: jenkins
    update_cache: yes
    state: present

- name: Start and enable Jenkins
  service:
    name: jenkins
    state: started
    enabled: yes
